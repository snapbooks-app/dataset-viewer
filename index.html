<!DOCTYPE html>
<html data-theme="cupcake" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Dataset Viewer</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.0.0/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* System message collapsible styling */
    .system-message-content.collapsed {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
      -webkit-line-clamp: var(--lines-to-show);
      line-clamp: var(--lines-to-show);
      transition: all 0.3s ease-in-out;
    }

    .system-message-content.expanded {
      display: block;
      transition: all 0.3s ease-in-out;
    }

    /* Responsive line limits */
    :root {
      --lines-to-show: 3; /* Default for mobile */
    }

    /* Tablet and larger screens */
    @media (min-width: 768px) {
      :root {
        --lines-to-show: 5;
      }
    }

    /* Desktop and larger screens */
    @media (min-width: 1024px) {
      :root {
        --lines-to-show: 8;
      }
    }

    /* Smooth transitions for toggle button icon */
    .system-message-toggle svg {
      transition: transform 0.2s ease-in-out;
    }

    /* Hover effect for toggle button */
    .system-message-toggle:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }
  </style>
  </head>
  <body class="bg-base-200 flex flex-col h-full">
  <!-- Main content area with bottom padding -->
  <div class="flex-1 overflow-y-auto" style="padding-bottom: 4rem;">
    <div class="p-4 pb-16"> <!-- Added pb-16 for bottom padding -->
      <!-- Search Section -->
      <div class="search-container bg-base-100 rounded-lg shadow-lg p-4 mb-4">
        <div class="flex items-center gap-3">
          <div class="flex-1">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Search messages..." 
              class="input input-bordered w-full"
            />
          </div>
          <button id="clear-search" class="btn btn-ghost btn-sm" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div id="search-status" class="text-sm text-base-content/60 mt-2" style="display: none;"></div>
      </div>
      
      <div class="chat-container bg-base-100 rounded-lg shadow-lg p-6 mb-16">
        <!-- Chat messages will be inserted here -->
      </div>
    </div>
  </div>
  
    <!-- Bottom navigation -->
    <div class="btm-nav bg-base-100">
      <button id="load-button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 0 0-1.883 2.542l.857 6a2.25 2.25 0 0 0 2.227 1.932H19.05a2.25 2.25 0 0 0 2.227-1.932l.857-6a2.25 2.25 0 0 0-1.883-2.542m-16.5 0V6A2.25 2.25 0 0 1 6 3.75h3.879a1.5 1.5 0 0 1 1.06.44l2.122 2.12a1.5 1.5 0 0 0 1.06.44H18A2.25 2.25 0 0 1 20.25 9v.776" />
        </svg>      
      </button>
      <button id="prev-button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z" />
        </svg>      
      </button>
      <button id="next-button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
        </svg>      
      </button>
    </div>
  
    <script src="renderer.js"></script>
  </body>
</html>
